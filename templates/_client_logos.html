<div class="client-logo-wall" aria-label="Clientes que já confiaram na Megui">
  {% for brand in trusted_brands %}
  <div class="client-logo-card">
    <img class="client-logo" src="{{ url_for('static', filename='img/clientes/' ~ brand.image) }}" alt="{{ brand.name }}" loading="lazy" decoding="async">
  </div>
  {% endfor %}
</div>
